<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>OS 3D — Interacción Mano</title>
  <!-- <base href="/OS/">  Descomenta si tu página está en /OS/ dentro de GitHub Pages -->

  <!-- Favicon para evitar 404 -->
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAPAAAP///wAAACwAAAAAAQABAEACAkQBADs=">

  <!-- =======================  ESTILOS  ======================= -->
  <style>
    :root{
      --bg-grad-1:#1e3c72;
      --bg-grad-2:#2a5298;
      --accent:#0078d4;
      --text:#333;
      --window:#fff;
      --shadow:0 4px 12px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',sans-serif}

    /* ---------- Orden de capas ---------- */
    #container{position:relative;width:100%;height:100%;z-index:1}

    canvas,video,.css3d{position:absolute;top:0;left:0;width:100%;height:100%}

    /* El vídeo es solo fuente para MediaPipe, nunca visible */
    video{
      width:0;height:0;           /* ocupa cero pantalla */
      opacity:0 !important;
      pointer-events:none;
      z-index:-1;
    }

    /* ---------- Escritorio ---------- */
    .icon,.window{
      user-select:none;border-radius:8px;
      box-shadow:var(--shadow);background:var(--window);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      cursor:pointer;transition:transform .2s;
    }
    .icon{width:120px;height:120px}
    .icon:hover{transform:scale(1.05)}
    .icon img{width:64px;height:64px;margin-top:4px}
    .icon span{margin-top:6px;font-size:.9rem;color:var(--text)}

    /* ---------- Ventanas ---------- */
    .window{
      width:380px;height:260px;opacity:0;transform:scale(.85);
      transition:opacity .3s ease,transform .3s ease;
    }
    .window.active{opacity:1;transform:scale(1)}
    .titlebar{
      background:var(--accent);color:#fff;padding:6px 10px;
      display:flex;justify-content:space-between;align-items:center;
      cursor:move;font-weight:600;font-size:.95rem
    }
    .content{flex:1;padding:8px;background:#f7f7f7;overflow:auto}
    .close-btn{
      border:none;border-radius:50%;width:20px;height:20px;
      background:#e81123;color:#fff;font-weight:bolder;cursor:pointer
    }
    .close-btn:hover{filter:brightness(1.1)}
    textarea,pre,input,iframe{width:100%;height:100%;border:none;background:#fff}
    textarea{resize:none;padding:8px;font-family:inherit}

    /* ---------- Overlay de inicio ---------- */
    #overlay{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,.8);color:#fff;z-index:3;
      display:flex;flex-direction:column;justify-content:center;
      align-items:center;text-align:center;padding:20px;
    }
    #overlay.hidden{display:none}
    #overlay button{margin-top:20px;padding:10px 20px;font-size:1rem;cursor:pointer}
  </style>
</head>
<body>
  <div id="container"></div>
  <video id="camera"></video>

  <!-- ---------- Ventana de inicio ---------- -->
  <div id="overlay">
    <p>Permite la cámara para usar gestos de mano.</p>
    <p>Si no está disponible, podrás usar el mouse o la pantalla táctil.</p>
    <p id="overlay-msg"></p>
    <button id="start-btn">Comenzar</button>
  </div>

  <!-- =======================  LIBRERÍAS  ======================= -->
  <!-- Three.js r178 (ES Modules) -->
  <script type="importmap">
  {
    "imports": {
      "three":            "./vendor/three/three.module.js",
      "three/addons/":    "./vendor/three/"
    }
  }
  </script>

  <!-- MediaPipe Hands v0.10.x -->
  <script src="./vendor/mediapipe/hands.min.js"></script>
  <script src="./vendor/mediapipe/drawing_utils.min.js"></script>

  <!-- =======================  APP  ======================= -->
  <script type="module" src="app.js"></script>
</body>
</html>
