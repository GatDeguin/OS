<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>OS 3D — Interacción Mano</title>
  <!-- <base href="/OS/">  Descomenta si tu página está en /OS/ dentro de GitHub Pages -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Favicon para evitar 404 -->
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAPAAAP///wAAACwAAAAAAQABAEACAkQBADs=">

  <!-- =======================  ESTILOS  ======================= -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash">
    <canvas></canvas>
    <div class="title">OS 3D</div>
    <div class="loader"></div>
  </div>
  <div id="container"></div>
  <video id="camera" playsinline></video>

  <!-- ---------- Ventana de inicio ---------- -->
  <div id="overlay">
    <p>Permite la cámara para usar gestos de mano.</p>
    <p>Si no está disponible, podrás usar el mouse o la pantalla táctil.</p>
    <p id="overlay-msg"></p>
    <select id="camera-select"></select>
    <button id="start-btn">Comenzar</button>
  </div>

  <div id="taskbar">
    <button id="start-button">Inicio</button>
    <div id="start-menu">
      <input type="text" id="start-search" placeholder="Buscar...">
    </div>
    <div id="taskbar-windows"></div>
  </div>
  <div id="toast-container"></div>

  <!-- =======================  LIBRERÍAS  ======================= -->
  <!-- Three.js r178 (ES Modules) -->
  <script type="importmap">
  {
    "imports": {
      "three":            "./vendor/three/three.module.js",
      "three/addons/":    "./vendor/three/",
      "cannon-es":        "./vendor/cannon-es/cannon-es.js"
    }
  }
  </script>

  <!-- MediaPipe Hands v0.10.x -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.min.js"></script>

  <!-- =======================  APP  ======================= -->
  <script type="module" src="src/splash.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
